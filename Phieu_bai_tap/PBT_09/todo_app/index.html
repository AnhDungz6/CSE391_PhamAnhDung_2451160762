<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>AnhDungz.</h1>
        <p class="subtitle">stay focused, stay sharp.</p>
      </header>

      <div class="input-row">
        <input
          id="todoInput"
          type="text"
          placeholder="add a new task…"
          autocomplete="off"
        />
        <button id="addBtn">+</button>
      </div>

      <div class="toolbar">
        <span id="itemsLeft">0 items left</span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button id="clearCompleted">Clear done</button>
      </div>

      <ul id="todoList"></ul>

      <p class="hint">click to complete · double-click to edit</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
