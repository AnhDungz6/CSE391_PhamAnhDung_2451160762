<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Quản lý người dùng</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div>
                <h1 class="app-title">User Directory</h1>
                <p class="app-subtitle">Hệ thống quản trị và đồng bộ thông tin nhân sự</p>
            </div>
            <button id="add-user-btn" class="btn btn-primary">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Thêm nhân sự
            </button>
        </header>

        <!-- Search and Filter Section -->
        <div class="filter-bar">
            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Tìm kiếm nhân sự theo tên hoặc email...">
            </div>
        </div>

        <!-- Users Directory List Grid -->
        <main class="users-grid" id="users-grid">
            <!-- Rendered cards or Skeleton loaders will go here -->
        </main>
    </div>

    <!-- User Form Modal (Used for Create and Update) -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Thêm nhân sự mới</h3>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <form id="user-form" class="user-form">
                <input type="hidden" id="form-user-id">
                
                <div class="form-group">
                    <label for="form-name">Họ và tên *</label>
                    <input type="text" id="form-name" required placeholder="Nhập họ và tên đầy đủ">
                </div>

                <div class="form-group">
                    <label for="form-email">Địa chỉ Email *</label>
                    <input type="email" id="form-email" required placeholder="example@domain.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="form-username">Tên đăng nhập (Username)</label>
                        <input type="text" id="form-username" placeholder="john.doe">
                    </div>
                    <div class="form-group">
                        <label for="form-phone">Số điện thoại</label>
                        <input type="text" id="form-phone" placeholder="0123-456-789">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="form-company">Công ty</label>
                        <input type="text" id="form-company" placeholder="Tập đoàn ABC">
                    </div>
                    <div class="form-group">
                        <label for="form-website">Website</label>
                        <input type="text" id="form-website" placeholder="abc.com">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Hủy bỏ</button>
                    <button type="submit" class="btn btn-primary" id="modal-submit-btn">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal (Custom Confirm Dialog for Premium Feel) -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-card confirm-card">
            <div class="confirm-icon">🗑️</div>
            <h3>Xác nhận xóa</h3>
            <p>Bạn có chắc chắn muốn xóa nhân sự <strong id="delete-user-name">--</strong> khỏi danh sách? Hành động này không thể hoàn tác.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="delete-cancel-btn">Hủy</button>
                <button class="btn btn-danger" id="delete-confirm-btn">Xác nhận xóa</button>
            </div>
        </div>
    </div>

    <!-- Feedback Toasts -->
    <div class="toast-container" id="toast-container">
        <!-- Toast elements will be injected here dynamically -->
    </div>

    <script src="app.js"></script>
</body>
</html>
