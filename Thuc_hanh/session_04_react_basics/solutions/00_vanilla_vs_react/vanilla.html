<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Todo — Vanilla JS</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 2rem auto;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-bottom: 1px solid #eee;
      }

      .todo-item.done span {
        text-decoration: line-through;
        color: #999;
      }

      .todo-item button {
        margin-left: auto;
        background: #e74c3c;
        color: white;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      }

      input[type="text"] {
        padding: 8px;
        width: 70%;
      }

      button.add-btn {
        padding: 8px 16px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>📋 Todo List</h1>

    <div>
      <input type="text" id="todoInput" placeholder="Nhập công việc..." />

      <button class="add-btn" onclick="addTodo()">Thêm</button>
    </div>

    <div id="todoList"></div>

    <script>
      let todos = [];

      // Render toàn bộ danh sách
      function renderTodos() {
        // Lấy phần tử todoList
        const list = document.getElementById("todoList");

        // Render HTML
        list.innerHTML = todos
          .map(
            (todo) => `
              <div class="todo-item ${todo.done ? "done" : ""}">
                
                <input
                  type="checkbox"
                  ${todo.done ? "checked" : ""}
                  onchange="toggleTodo(${todo.id})"
                />

                <span>${todo.text}</span>

                <button onclick="deleteTodo(${todo.id})">
                  Xóa
                </button>

              </div>
            `,
          )
          .join("");
      }

      // Thêm todo mới
      function addTodo() {
        // Lấy input
        const input = document.getElementById("todoInput");

        // Lấy text
        const text = input.value.trim();

        // Không cho nhập rỗng
        if (text === "") {
          return;
        }

        // Tạo object todo mới
        const newTodo = {
          id: Date.now(),
          text: text,
          done: false,
        };

        // Push vào mảng
        todos.push(newTodo);

        // Render lại
        renderTodos();

        // Xóa input
        input.value = "";
      }

      // Toggle done
      function toggleTodo(id) {
        // Tìm todo theo id
        const todo = todos.find((item) => item.id === id);

        // Đảo trạng thái done
        if (todo) {
          todo.done = !todo.done;
        }

        // Render lại
        renderTodos();
      }

      // Xóa todo
      function deleteTodo(id) {
        // Lọc bỏ todo theo id
        todos = todos.filter((todo) => todo.id !== id);

        // Render lại
        renderTodos();
      }
    </script>
  </body>
</html>
